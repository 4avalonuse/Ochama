<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ochama</title><link rel="stylesheet" href="./src/styles/app.css?v=20260925-3"></head>
<body>
<main id="app">
<header class="app-header"><div class="app-brand">OCHAMA</div><div class="market-header"><select id="asset-select" class="asset-select" aria-label="Ativo"><option value="BTC-USD" selected>₿ BTCUSD</option><option value="SOL-USD">SOL SOLUSD</option></select><span id="asset-price" class="asset-price">—</span><span class="data-source"><span id="data-source">Yahoo</span></span><button id="refresh-data" class="header-action" type="button" aria-label="Atualizar dados">↻</button><button id="config-button" class="header-action" type="button" aria-label="Configurações">⚙</button></div><span id="status" class="app-status" aria-live="polite">Inicializando…</span></header>
