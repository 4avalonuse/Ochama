<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ochama</title><link rel="stylesheet" href="./src/styles/app.css?v=20260925-8"></head>
<body><main id="app">
<header class="app-header"><div class="app-brand">OCHAMA</div><div class="market-header">
<select id="asset-select" class="asset-select" aria-label="Ativo"><option value="BTC-USD" selected>BTCUSD</option><option value="SOL-USD">SOLUSD</option></select>
<span id="asset-price" class="asset-price">—</span>
<select id="interval-select" class="interval-select" aria-label="Intervalo"><option value="1m">m</option><option value="1h">h</option><option value="1d" selected>D</option><option value="1w">W</option><option value="1M">M</option></select>
<select id="provider-select" class="provider-select" aria-label="Servidor"><option value="yahoo" selected>Yahoo</option><option value="binance-us">Binance.US</option></select>
<button id="refresh-data" class="header-action" type="button" aria-label="Atualizar dados">↻</button><button id="config-button" class="header-action" type="button" aria-label="Configurações">⚙</button></div>
<span id="status" class="app-status" aria-live="polite">Inicializando…</span></header>
<section id="chart" class="chart-shell" aria-label="Gráfico">
<button id="fit-toggle" class="fit-toggle" type="button">FIT</button>
<div class="drawing-toolbar" aria-label="Ferramentas de desenho">
<button id="drawing-nav" class="drawing-tool is-active" type="button">PAN</button><button id="drawing-select" class="drawing-tool" type="button">SELECT</button>
<button id="drawing-line" class="drawing-tool is-active" type="button">LINE</button>
</div>
</section>
<footer class="chart-footer"><button id="scale-toggle" class="scale-toggle" type="button" aria-pressed="false">NORMAL</button></footer>
</main><script type="module" src="./src/app/bootstrap.js?v=20260925-8"></script></body></html>
